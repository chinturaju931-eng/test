# Free Render web service. Supply a separate Neon Free PostgreSQL connection URL.
# No Render database or paid disk is created.
services:
  - type: web
    name: commuteads-team
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SETUP_CODE
        generateValue: true
